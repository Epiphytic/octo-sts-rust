name = "octo-sts"
main = "build/worker/shim.mjs"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "cargo install -q --locked worker-build@0.7.5 && worker-build --release"

# =============================================================================
# Development environment (default)
# =============================================================================
[vars]
NOSTR_EXCHANGE_ENABLED = "false"
NOSTR_EXCHANGE_URL = "https://octo-sts.liam-helmer-428.workers.dev/sts/exchange/nostr"
NOSTR_RATE_PER_MINUTE = "10"
DOMAIN = "https://octo-sts.liam-helmer-428.workers.dev"

[[kv_namespaces]]
binding = "OCTO_STS_KV"
id = "c63425e5768f477a80ab468002cfcc82"

# =============================================================================
# Production environment
# =============================================================================
[env.production]
name = "octo-sts-production"
workers_dev = true           # Enable workers.dev URL as fallback

[env.production.vars]
NOSTR_EXCHANGE_ENABLED = "false"
NOSTR_EXCHANGE_URL = "https://sts.epiphytic.org/sts/exchange/nostr"
NOSTR_RATE_PER_MINUTE = "10"
DOMAIN = "https://sts.epiphytic.org"

[[env.production.kv_namespaces]]
binding = "OCTO_STS_KV"
id = "59bc5cdfdb384fec8146b9d284aedf22"

# Custom domain routing (requires DNS: CNAME sts -> octo-sts-production.liam-helmer-428.workers.dev)
[[env.production.routes]]
pattern = "sts.epiphytic.org/*"
zone_name = "epiphytic.org"

# Secrets (set via `wrangler secret put <NAME> --env production`):
# - GITHUB_APP_ID
# - GITHUB_APP_PRIVATE_KEY
# - GITHUB_WEBHOOK_SECRET

[[durable_objects.bindings]]
name = "NOSTR_REPLAY"
class_name = "NostrReplay"

[[env.production.durable_objects.bindings]]
name = "NOSTR_REPLAY"
class_name = "NostrReplay"

[[migrations]]
tag = "nostr-replay-v1"
new_sqlite_classes = ["NostrReplay"]
